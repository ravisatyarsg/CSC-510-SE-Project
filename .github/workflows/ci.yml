name: CI/CD Pipeline

on:
  push:
    branches: [ main, proj2, develop ]
  pull_request:
    branches: [ main, proj2, develop ]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('Proj2/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      working-directory: ./Proj2
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Python tests
      working-directory: ./Proj2
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./Proj2/coverage.xml
        flags: python
        name: python-coverage

  nodejs-tests:
    name: Node.js Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: Proj2/src/backend/package.json
    
    - name: Install backend dependencies
      working-directory: ./Proj2/src/backend
      run: npm install
    
    - name: Run backend tests
      working-directory: ./Proj2/src/backend
      run: npm test -- --coverage
    
    - name: Set up Node.js for frontend
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: Proj2/src/frontend/package.json
    
    - name: Install frontend dependencies
      working-directory: ./Proj2/src/frontend
      run: npm install
    
    - name: Run frontend tests
      working-directory: ./Proj2/src/frontend
      run: npm test -- --coverage --watchAll=false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [python-tests, nodejs-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      working-directory: ./Proj2
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install backend dependencies
      working-directory: ./Proj2/src/backend
      run: npm install
    
    - name: Run integration tests
      working-directory: ./Proj2
      run: |
        pytest tests/integration/ -v

  lint:
    name: Linting
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      working-directory: ./Proj2
      run: |
        pip install flake8 pylint black
    
    - name: Lint Python code
      working-directory: ./Proj2
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install ESLint
      working-directory: ./Proj2/src/backend
      run: npm install --save-dev eslint
    
    - name: Lint JavaScript code
      working-directory: ./Proj2/src/backend
      run: |
        npx eslint . --ext .js || true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [python-tests, nodejs-tests, integration-tests]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        echo "All tests completed!"
        echo "Python tests: ${{ needs.python-tests.result }}"
        echo "Node.js tests: ${{ needs.nodejs-tests.result }}"
        echo "Integration tests: ${{ needs.integration-tests.result }}"

